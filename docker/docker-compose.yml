version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: naree_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: naree_vending
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d naree_vending"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MQTT Broker (Eclipse Mosquitto) for IoT machines
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: naree_mqtt
    restart: always
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # Backend Node.js / Express API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: naree_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/naree_vending?schema=public"
      JWT_SECRET: "naree_super_secure_production_key_2026"
      PAYMENT_PROVIDER_MODE: "mock"
      PHONEPE_MERCHANT_ID: "MERCHANT_NAREE_001"
      PHONEPE_SALT_KEY: "placeholder_salt_key"
      PHONEPE_SALT_INDEX: "1"
      PHONEPE_ENVIRONMENT: "UAT"
      RAZORPAY_KEY_ID: "rzp_test_placeholder"
      RAZORPAY_KEY_SECRET: "rzp_secret_placeholder"
      MQTT_BROKER_URL: "mqtt://mosquitto:1883"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Next.js Dashboard
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: naree_frontend
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
